version: 0.4.0.0
# 'add' only touches files that have no header at all.  Existing headers
# (and, importantly, the years in them) are left alone; see
# https://github.com/wireapp/wire-server/pull/4851.
run-mode: add
source-paths:
  - libs
  - services
  - tools
  - integration
excluded-paths:
  - services/wire-server-enterprise
template-paths:
  - tools/headroom-templates
variables:
  organization: Wire Swiss GmbH
  email: opensource@wire.com
  project: This file is part of the Wire Server implementation.
  # only ever used for files that get a header added now, so this needs no
  # maintenance and causes no churn in files that already have one.
  year: "{{ _current_year }}"
license-headers:
  haskell:
    file-extensions: ["hs", "hsc"]
    # after pragmas, to make Ormolu happy
    put-after: ["^{-#"]
    # but before the module header (or comment) in any case
    put-before: ["^-- \\|", "--", "^module"]
    margin-bottom-code: 1
    margin-top-code: 1
    line-comment:
      prefixed-by: "--"
  rust:
    file-extensions: ["rs"]
    margin-bottom-code: 1
    margin-top-code: 1
    line-comment:
      prefixed-by: "//"
