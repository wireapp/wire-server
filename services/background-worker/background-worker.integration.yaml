logLevel: Debug

backgroundWorker:
  host: 0.0.0.0
  port: 8089

federatorInternal:
  host: 127.0.0.1
  port: 8097

brig:
  host: 0.0.0.0
  port: 8082
galley:
  host: 127.0.0.1
  port: 8080
gundeck:
  host: 127.0.0.1
  port: 8086

cassandra:
  endpoint:
    host: 127.0.0.1
    port: 9042
  keyspace: gundeck_test

cassandraBrig:
  endpoint:
    host: 127.0.0.1
    port: 9042
  keyspace: brig_test

postgresqlPool:
  size: 5
  acquisitionTimeout: 10s
  idlenessTimeout: 10m

rabbitmq:
  host: 127.0.0.1
  port: 5671
  vHost: /
  adminHost: 127.0.0.1
  adminPort: 15671
  enableTls: true
  caCert: test/resources/rabbitmq-ca.pem
  insecureSkipVerifyTls: false

# Email transport for the background-worker (same shape as brig's emailSMS.email).
# SES takes precedence over SMTP when both are configured.
# Email templates for composing the emails queued by brig;
# mirrors the values brig used to configure in its emailSMS block.
emailTemplates:
  templateDir: ../../libs/wire-subsystems/templates
  emailSender: backend-integration@wire.com
  templateBranding:
    brand: Wire
    brandUrl: https://wire.com
    brandLabelUrl: wire.com # This is the text in the label for the above URL
    brandLogoUrl: https://wire.com/p/img/email/logo-email-black.png
    brandService: Wire Service Provider
    copyright: © WIRE SWISS GmbH
    misuse: misuse@wire.com
    legal: https://wire.com/legal/
    forgot: https://wire.com/forgot/
    support: https://support.wire.com/
  user:
    activationUrl: https://example.com/verify/?key=${key}&code=${code}
    teamActivationUrl: https://example.com/verify/?key=${key}&code=${code}
    passwordResetUrl: https://example.com/reset/?key=${key}&code=${code}
    deletionUrl: https://example.com/d/?key=${key}&code=${code}
  team:
    tInvitationUrl: https://example.com/join/?team-code=${code}
    tExistingUserInvitationUrl: https://example.com/accept-invitation/?team-code=${code}
    tActivationUrl: https://example.com/verify/?key=${key}&code=${code}
    tCreatorWelcomeUrl: https://example.com/creator-welcome-website
    tMemberWelcomeUrl: https://example.com/member-welcome-website
  provider:
    homeUrl: https://provider.localhost/
    providerActivationUrl: http://127.0.0.1:8080/verify/bot/?key=${key}&code=${code}
    approvalUrl: http://127.0.0.1:8080/provider/approve?key=${key}&code=${code}
    approvalTo: success@simulator.amazonses.com
    providerPwResetUrl: http://127.0.0.1:8080/reset/bot/?key=${key}&code=${code}

email:
  sesQueue: integration-brig-events
  sesEndpoint: http://localhost:4569 # https://email.eu-west-1.amazonaws.com

backendNotificationPusher:
  pushBackoffMinWait: 1000 # 1ms
  pushBackoffMaxWait: 1000000 # 1s
  remotesRefreshInterval: 10000 # 10ms

migrateConversations: false
migrationOptions:
  pageSize: 10000
  parallelism: 2
  timeout: 5s
migrateConversationCodes: false
migrateTeamFeatures: false
migrateDomainRegistration: false

# Background jobs consumer configuration for integration
backgroundJobs:
  concurrency: 4
  jobTimeout: 5s
  maxAttempts: 3

# Job dispatcher configuration for integration
jobs:
  pollInterval: 1s # Poll every second so due jobs are discovered promptly in tests
  workerThreads: 1 # Keep one worker per job queue in integration tests
  visibilityTimeout: 60s
  jobHeartbeatInterval: 30s
  workerHeartbeatInterval: 10s
  backoffBase: 2.0
  backoffCap: 86400s
  jitter: equal
  gracefulShutdownTimeout: 30s
  reaperInterval: 300s
  reaperTimeout: 300s
  workerStaleThreshold: 300s

# Meetings cleanup configuration for integration
meetingsCleanup:
  cleanOlderThanHours: 0.0014 # Clean meetings older than ~5 seconds
  batchSize: 100
  schedule: "* * * * *" # Run every minute

postgresMigration:
  conversation: postgresql
  conversationCodes: postgresql
  teamFeatures: postgresql
  domainRegistration: postgresql
  user: postgresql
