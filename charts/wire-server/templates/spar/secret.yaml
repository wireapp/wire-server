apiVersion: v1
kind: Secret
metadata:
  name: spar
  labels:
    app: spar
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
type: Opaque
data:
  {{- if .Values.spar.secrets.pgPassword }}
  pgPassword: {{ .Values.spar.secrets.pgPassword | b64enc | quote }}
  {{- end }}
