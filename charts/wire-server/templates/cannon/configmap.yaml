apiVersion: v1
data:
  {{- with .Values.cannon }}
  cannon.yaml: |
    logFormat: {{ .config.logFormat }}
    logLevel: {{ .config.logLevel }}
    logNetStrings: {{ .config.logNetStrings }}

    cannon:
      host: 0.0.0.0
      port: {{ .service.externalPort }}
      externalHostFile: /etc/wire/cannon/externalHost/host.txt

    federationDomain: {{ required "brig.config.optSettings.setFederationDomain is required" $.Values.brig.config.optSettings.setFederationDomain | quote }}
    brig:
      host: brig
      port: 8080
    galley:
      host: galley
      port: 8080
    {{- with required "gundeck.config.notificationFanInPostgres is required" $.Values.gundeck.config.notificationFanInPostgres }}
    notificationFanInPostgres:
      connection: {{ .connection | toYaml | nindent 8 }}
      pool: {{ .pool | toYaml | nindent 8 }}
      {{- if hasKey $.Values.gundeck.secrets "notificationFanInPostgresPassword" }}
      password: /etc/wire/cannon/fan-in-secrets/notificationFanInPostgresPassword
      {{- end }}
    {{- end }}

    gundeck:
      host: gundeck
      port: 8080

    cassandra:
      endpoint:
        host: {{ .config.cassandra.host }}
        port: 9042
      keyspace: gundeck
      {{- if eq (include "useCassandraTLS" .config.cassandra) "true" }}
      tlsCa: /etc/wire/cannon/cassandra/{{- (include "cannon.tlsSecretRef" .config | fromYaml).key }}
      {{- end }}

    {{- with .config.rabbitmq }}
    rabbitmq:
      host: {{ .host }}
      port: {{ .port }}
      vHost: {{ .vHost }}
      enableTls: {{ .enableTls }}
      insecureSkipVerifyTls: {{ .insecureSkipVerifyTls }}
      {{- if .tlsCaSecretRef }}
      caCert: /etc/wire/cannon/rabbitmq-ca/{{ .tlsCaSecretRef.key }}
      {{- end }}
    {{- end }}

    rabbitMqMaxConnections: {{ .config.rabbitMqMaxConnections }}
    rabbitMqMaxChannels: {{ .config.rabbitMqMaxChannels }}

    drainOpts:
      gracePeriodSeconds: {{ .config.drainOpts.gracePeriodSeconds }}
      millisecondsBetweenBatches: {{ .config.drainOpts.millisecondsBetweenBatches }}
      minBatchSize: {{ .config.drainOpts.minBatchSize }}

    disabledAPIVersions: {{ toJson .config.disabledAPIVersions }}
    notificationTTL: {{ .config.notificationTTL }}
  {{- end }}


kind: ConfigMap
metadata:
  name: cannon
