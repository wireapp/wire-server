# Synthetic upstreams shared by the Python and Haskell chart suites.
# These test ingress routing, not application business logic.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-test-backend
    data:
      server.py: |
        import json
        import sys
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):
                body = json.dumps({
                    "marker": "wire-ingress-regression-ok",
                    "upstream": sys.argv[1],
                    "certificate": self.headers.get("X-SSL-Certificate", ""),
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.send_header("Connection", "close")
                self.end_headers()
                self.wfile.write(body)
                self.close_connection = True

        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ingress-test-api
      template:
        metadata:
          labels:
            app: ingress-test-api
        spec: &pod
          automountServiceAccountToken: false
          containers:
            - &container
              name: backend
              image: python:3.13-alpine
              command: [python3, /app/server.py]
              args: [api]
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /
                  port: 8080
              resources:
                requests: {cpu: 10m, memory: 24Mi}
                limits: {memory: 64Mi}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: ingress-test-backend
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: federation
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ingress-test-federation
      template:
        metadata:
          labels:
            app: ingress-test-federation
        spec:
          <<: *pod
          containers:
            - <<: *container
              args: [federation]
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: webapp
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: webapp
      template:
        metadata:
          labels:
            app: webapp
        spec:
          <<: *pod
          containers:
            - <<: *container
              args: [webapp]
  - apiVersion: v1
    kind: Service
    metadata:
      name: nginz
    spec:
      selector:
        app: ingress-test-api
      ports:
        - port: 8080
          targetPort: 8080
  - apiVersion: v1
    kind: Service
    metadata:
      name: federator
    spec:
      selector:
        app: ingress-test-federation
      ports:
        - port: 8081
          targetPort: 8080
