# Default values for wire-ingress
httpRoute:
  # Annotations added to every HTTPRoute created by this chart.
  annotations: {}

gateway:
  # If true, a Gateway resource is created by this chart.
  # If false, set gateway.name to reference an existing Gateway.
  create: true
  # Name of the Gateway. Defaults to <release-name>-wire-ingress-gateway if empty.
  name: ""
  # Name of the GatewayClass installed by the Envoy Gateway controller.
  className: ""
  envoyProxy:
    # If true, an EnvoyProxy resource is created by this chart and the Gateway
    # references it via infrastructure.parametersRef.
    # Set to false when the GatewayClass already has a cluster-level EnvoyProxy
    # (e.g. a shared load balancer managed by the cluster operator), or when you
    # want to reference an existing EnvoyProxy via envoyProxy.name.
    create: true
    # Name of the EnvoyProxy resource.
    # When create: true  — the created resource uses this name (defaults to the Gateway name).
    # When create: false — if non-empty, the Gateway references this existing EnvoyProxy
    #                      via infrastructure.parametersRef (must be in the same namespace).
    #                      If empty, no parametersRef is set on the Gateway (GatewayClass
    #                      level EnvoyProxy takes effect).
    name: ""
    # Free-form EnvoyProxy spec, merged verbatim at the spec root.
    # Only used when create: true.
    # See https://gateway.envoyproxy.io/docs/api/extension_types/#envoyproxyspec
    # Example - shared load balancer across Gateways (single wire-ingress chart):
    #   spec:
    #     mergeGateways: true
    # Example - ClusterIP service (integration tests / no external LB):
    #   spec:
    #     provider:
    #       type: Kubernetes
    #       kubernetes:
    #         envoyService:
    #           type: ClusterIP
    spec: {}
  # Convenience shorthand for provider.kubernetes.envoyService.type.
  # Only takes effect when manageServiceType: true.
  # Do not combine with envoyProxy.spec.provider.kubernetes.envoyService.
  # Namespace where the Envoy Gateway controller runs its proxy pods.
  # Change only if you installed Envoy Gateway into a non-default namespace.
  controllerNamespace: envoy-gateway-system
  manageServiceType: true
  serviceType: LoadBalancer
  # Annotations to add to the Service created by Envoy Gateway.
  # Requires Gateway API CRDs v1.1+.
  # Example for AWS NLB:
  #   infrastructure:
  #     annotations:
  #       service.beta.kubernetes.io/aws-load-balancer-type: external
  #       service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
  infrastructure:
    annotations: {}
  # Enable if your load balancer sends PROXY protocol headers (e.g. Hetzner with
  # load-balancer.hetzner.cloud/uses-proxyprotocol: "true"). Creates a
  # ClientTrafficPolicy targeting the Gateway.
  proxyProtocol:
    enabled: false
    # If true, connections without a PROXY protocol header are also accepted.
    # Use this only if some traffic bypasses the load balancer (e.g. direct node access).
    optional: false
  listeners:
    https:
      port: 443
      # Required. Hostname restriction for the HTTPS listener.
      # Must be a wildcard or exact hostname covering this deployment's domains,
      # e.g. "*.example.com". This prevents OverlappingTLSConfig with the federator
      # listener (which uses the federation domain on the same port) — without an
      # explicit hostname both listeners are catch-all and Envoy degrades ALPN to
      # HTTP/1.1-only.
      # If your domains in config.dns span multiple subdomains, you need a custom
      # Gateway object with multiple listeners. See the Gateway API docs.
      hostname: ""
    # Enable the HTTP listener if you want to use HTTP01 challenges via cert-manager's
    # gatewayHTTPRoute solver. Requires cert-manager >= 1.14.
    # See the README for configuration details.
    http:
      enabled: false
      port: 80
      # Optional hostname restriction for the HTTP listener. Set alongside
      # listeners.https.hostname when using mergeGateways.
      hostname: ""
  # TLS parameters applied to every HTTPS listener of the Gateway (including the
  # federator listener). Rendered into the ClientTrafficPolicy resources.
  #
  # The defaults restrict Envoy to the mechanisms recommended by BSI TR-02102-2
  # ("Cryptographic Mechanisms: Recommendations and Key Lengths — Part 2: Use of
  # Transport Layer Security"), matching what the nginx ingress enforced via
  # ssl-protocols / ssl-ciphers in charts/ingress-nginx-controller.
  #
  # CAVEAT: Envoy cannot restrict TLS 1.3 cipher suites — they are fixed by
  # BoringSSL and `ciphers` below only applies to TLS 1.0-1.2. A stock Envoy
  # build therefore also offers TLS_CHACHA20_POLY1305_SHA256, which is not on
  # the TR-02102-2 list. See the "TR-02102-2 conformance" section of the README
  # for the two ways to close that gap.
  tls:
    # Set to false to leave all TLS parameters at Envoy's defaults.
    enabled: true
    # TR-02102-2 Table 2: TLS 1.3 (2032+) and TLS 1.2 (until end of 2031) are
    # recommended; TLS 1.0/1.1 are not. Valid: Auto, "1.0", "1.1", "1.2", "1.3".
    minVersion: "1.2"
    maxVersion: "1.3"
    # TR-02102-2 Table 3/4: recommended cipher suites for TLS 1.2.
    # Ignored when minVersion is "1.3" (Envoy Gateway rejects the combination).
    # The AES-128 counterparts (ECDHE-{ECDSA,RSA}-AES128-GCM-SHA256) are equally
    # conformant and can be added here for broader client compatibility.
    ciphers:
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
    # TR-02102-2 Tables 6 and 10: recommended Diffie-Hellman groups. Note that
    # X25519 — an Envoy default — is NOT on the BSI list, which is why this is
    # set explicitly. Every TLS 1.3 client must support secp256r1 (P-256), so
    # restricting to the NIST curves is safe in practice.
    ecdhCurves:
      - P-256
      - P-384
      - P-521
    # TR-02102-2 Tables 11 and 12. Left empty (Envoy defaults) because
    # restricting this is the change most likely to break older clients:
    # Envoy's defaults include rsa_pkcs1_* which TR-02102-2 only recommended
    # until the end of 2025. To drop those, set:
    #   signatureAlgorithms:
    #     - ecdsa_secp256r1_sha256
    #     - ecdsa_secp384r1_sha384
    #     - ecdsa_secp521r1_sha512
    #     - rsa_pss_rsae_sha256
    #     - rsa_pss_rsae_sha384
    #     - rsa_pss_rsae_sha512
    # Make sure the list covers the key type of your server certificate
    # (tls.privateKey.algorithm below defaults to ECDSA P-384).
    signatureAlgorithms: []
  # ALPN configuration for HTTP/2 support with multiple listeners.
  # When using multiple listeners with overlapping certificate SANs,
  # Envoy Gateway may downgrade to HTTP/1.1. This ClientTrafficPolicy
  # explicitly configures ALPN to allow HTTP/2.
  alpn:
    enabled: true
    protocols:
      - h2        # HTTP/2
      - http/1.1  # HTTP/1.1 fallback
  # Set to false to skip creating EnvoyPatchPolicy resources.
  # EnvoyPatchPolicy requires extensionApis.enableEnvoyPatchPolicy: true
  # in the EnvoyGateway ConfigMap (see README).
  patchPolicies:
    enabled: true
    # Set to true when the GatewayClass uses mergeGateways: true.
    # With mergeGateways, EnvoyPatchPolicy must target the GatewayClass
    # rather than the individual Gateway. Default false targets the Gateway,
    # which is correct for single-Gateway (non-merged) deployments.
    targetGatewayClass: false

# NOTE: Please provide names. Here are naming suggestions:
# You need to reference those in the nginz helm chart nginx_conf.deeplink.endpoints
# config:
#   dns:
#     https: nginz-https.<domain>
#     ssl: nginz-ssl.<domain>       # ignored if websockets.enabled == false
#     webapp: webapp.<domain>       # ignored if webapp.enabled == false
#     fakeS3: assets.<domain>       # ignored if fakeS3.enabled == false
#     federator: federator.<domain> # ignored unless federator.enabled == true
#     certificateDomain: federator.<domain>  # domain to use in the federator CSR
#     teamSettings: teams.<domain>  # ignored unless teamSettings.enabled == true
#     accountPages: account.<domain> # ignored unless accountPages.enabled == true
#
# MULTI-INGRESS (multiple backend domains from one release)
# ---------------------------------------------------------
# To serve the same backend on several domains, set config.domains INSTEAD of
# config.dns. It is a list; the FIRST entry is the primary (its resources keep
# the un-suffixed names, and its frontend apps set their own CSP). Every
# additional entry gets its own Gateway HTTPS listener (`https-<name>`), its own
# certificate/secret, and — being an "additional ingress" — a per-domain
# Content-Security-Policy header injected on the webapp/team-settings/
# account-pages routes (mirrors the legacy nginx-ingress-services behaviour).
#
# config.dns and config.domains are mutually exclusive; config.domains wins.
#
# Multi-ingress is ALSO mutually exclusive with federation: you cannot enable
# federator.enabled together with config.domains. Multi-ingress is the special
# case (a single customer serving one backend on several unrelated domains);
# federation is the common case. Pick one — federation with a single backend
# domain via config.dns, or multi-ingress via config.domains with the federator
# disabled. Setting both fails template rendering with a clear error.
#
# config:
#   domains:
#     - name: blueberry                      # required; used for resource-name suffix & listener section
#       base: blueberry.example.com          # required; CSP wildcard (*.base) and default listener hostname (*.base)
#       # hostname: "*.blueberry.example.com" # optional listener hostname override (defaults to *.base)
#       dns:
#         https: nginz-https.blueberry.example.com
#         ssl: nginz-ssl.blueberry.example.com
#         webapp: webapp.blueberry.example.com
#         # teamSettings / accountPages / fakeS3 as needed
#     - name: red
#       base: red.example.org
#       dns:
#         https: nginz-https.red.example.org
#         ssl: nginz-ssl.red.example.org
#         webapp: webapp.red.example.org
#       # renderCSP: false                   # optional: disable the injected CSP for this domain
#       tls:
#         # secretName: ""                   # optional TLS secret name override (defaults to a per-domain name)
#         issuer:                            # optional per-domain cert-manager issuer override (defaults to tls.issuer)
#           name: letsencrypt-red
#           kind: ClusterIssuer

websockets:
  enabled: true
webapp:
  enabled: true
fakeS3:
  enabled: true
  # Guard rules applied BEFORE the default catch-all rule.
  # These handle provider-specific paths. Adjust if using a different S3 provider.
  # Uses Gateway API HTTPRoute rule format (matches/filters/backendRefs).
  guardingRules:
    - matches:
        - path:
            type: PathPrefix
            value: /minio/
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 301
teamSettings:
  enabled: false
accountPages:
  enabled: false

service:
  # Set false to reuse the backend Services owned by nginx-ingress-services
  # (e.g. during a migration) instead of creating them here.
  create: true
  webapp:
    externalPort: 8080
  teamSettings:
    externalPort: 8080
  accountPages:
    externalPort: 8080
  s3:
    externalPort: 9000
    serviceName: fake-aws-s3
  # Set this to false if minio is not provided by the fake-aws-s3 chart
  useFakeS3: true
  federator:
    # Must match service.externalFederatorPort in the federator chart.
    externalPort: 8081
  nginz:
    # Update this if you've overwritten the default HTTP port in nginz.
    httpPort: 8080
    # Update this if you've overwritten the default WebSocket port in nginz.
    wsPort: 8081

# Federator

federator:
  enabled: false
  integrationTestHelper: false
  tls:
    # If true, a cert-manager Certificate is created for the federator TLS secret.
    # Independent of the global tls.useCertManager setting.
    useCertManager: true
    # Name of the TLS Secret for the federator listener.
    # When useCertManager is true, cert-manager writes the certificate into this secret.
    # When useCertManager is false, the secret must exist before deploying.
    secretName: "federator-certificate-secret"
    duration: 2160h
    renewBefore: 360h
    privateKey:
      rotationPolicy: Always
    # Issuer for federator certificate (mTLS with Client Auth EKU).
    # If not set, uses global tls.issuer configuration.
    issuer: {}
      # name: ""
      # kind: ""
      # group: ""

# TLS settings

tls:
  secret:
    # If true, a kubernetes.io/tls Secret is created from secrets.tlsWildcardCert
    # and secrets.tlsWildcardKey. Set to false if the secret is managed externally.
    create: true
    # Override the name of the Secret. If not set, the name is derived from the release name.
    nameOverride: ""

  # If set to true create Certificate object that request from tls.issuer
  useCertManager: false
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 384  # 521 is not supported by Let's Encrypt

  createIssuer: true
  issuer:
    name: letsencrypt-http01
    kind: Issuer  # Issuer | ClusterIssuer

certManager:
  # If true, uses the Let's Encrypt staging API (certificates are NOT trusted):
  #   https://acme-staging-v02.api.letsencrypt.org/directory
  # If false (default), uses the production API (certificates are trusted):
  #   https://acme-v02.api.letsencrypt.org/directory
  inTestMode: false
  certmasterEmail:
  customSolvers:

# For TLS (manual mode, tls.useCertManager: false, tls.secret.create: false):
# secrets:
#   tlsWildcardCert: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
#   tlsWildcardKey: |
#     -----BEGIN PRIVATE KEY-----
#     ...
#     -----END PRIVATE KEY-----
#
# When federator.enabled is true, a ConfigMap named `federator-ca` with a `ca.crt` key
# must exist in the release namespace. It is created by the wire-server chart
# and is referenced by the ClientTrafficPolicy for mTLS.
