{{- if .Values.gateway.create }}
{{- $placeholderPort := int .Values.gateway.listeners.placeholder.port }}
{{- if or (eq (int .Values.gateway.listeners.https.port) $placeholderPort) (and .Values.gateway.listeners.http.enabled (eq (int .Values.gateway.listeners.http.port) $placeholderPort)) }}
{{- fail "gateway.listeners.placeholder.port must differ from the HTTPS and enabled HTTP listener ports" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "wire-ingress.gatewayName" . | quote }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.create is true" .Values.gateway.className | quote }}
  {{- $envoyProxyName := .Values.gateway.envoyProxy.name }}
  {{- if .Values.gateway.envoyProxy.create }}
  {{- $envoyProxyName = $envoyProxyName | default (include "wire-ingress.gatewayName" .) }}
  {{- end }}
  {{- if (or .Values.gateway.infrastructure.annotations .Values.gateway.infrastructure.labels $envoyProxyName) }}
  infrastructure:
    {{- with .Values.gateway.infrastructure.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.gateway.infrastructure.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $envoyProxyName }}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $envoyProxyName | quote }}
    {{- end }}
  {{- end }}
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    # Required placeholder; a separate port avoids plaintext policy conflicts.
    - name: placeholder
      port: {{ .Values.gateway.listeners.placeholder.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: DoesNotExist
{{- end }}
