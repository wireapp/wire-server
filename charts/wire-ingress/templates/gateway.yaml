{{- if .Values.gateway.create }}
{{- if not .Values.gateway.className }}
{{- fail "gateway.className must be set when gateway.create is true (set it to the name of your GatewayClass, e.g. 'envoy')" }}
{{- end }}
{{- if or (eq (int .Values.gateway.listeners.https.port) 65535) (and .Values.gateway.listeners.http.enabled (eq (int .Values.gateway.listeners.http.port) 65535)) }}
{{- fail "port 65535 is reserved for the Gateway placeholder listener" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "wire-ingress.gatewayName" . | quote }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  {{- $envoyProxyName := "" }}
  {{- if .Values.gateway.envoyProxy.create }}
  {{- $envoyProxyName = .Values.gateway.envoyProxy.name | default (include "wire-ingress.gatewayName" .) }}
  {{- else if .Values.gateway.envoyProxy.name }}
  {{- $envoyProxyName = .Values.gateway.envoyProxy.name }}
  {{- end }}
  {{- if (or .Values.gateway.infrastructure.annotations .Values.gateway.infrastructure.labels $envoyProxyName) }}
  infrastructure:
    {{- with .Values.gateway.infrastructure.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.gateway.infrastructure.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $envoyProxyName }}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $envoyProxyName | quote }}
    {{- end }}
  {{- end }}
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    # Gateway API requires a Gateway-owned listener. Keep it off application
    # ports: Envoy cannot apply ListenerSet policies to shared plaintext ports.
    - name: placeholder
      port: 65535
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: DoesNotExist
{{- end }}
