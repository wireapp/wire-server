{{- if .Values.webapp.enabled }}
{{- $root := . -}}
{{- $domains := include "wire-ingress.domains" . | fromJsonArray -}}
{{- range $domain := $domains }}
{{- if $domain.webapp }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wire-ingress.fullname" $root }}-webapp{{ $domain.suffix }}
  namespace: {{ $root.Release.Namespace }}
  {{- with $root.Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    chart: "{{ $root.Chart.Name }}-{{ $root.Chart.Version }}"
    release: "{{ $root.Release.Name }}"
    heritage: "{{ $root.Release.Service }}"
spec:
  parentRefs:
    - name: {{ include "wire-ingress.gatewayName" $root | quote }}
      namespace: {{ $root.Release.Namespace | quote }}
      kind: Gateway
      sectionName: {{ $domain.section }}
  hostnames:
    - {{ required "config.dns.webapp is required when webapp.enabled is true" $domain.webapp | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{/* No CSP header is injected here. Unlike team-settings, the webapp
      sets multi-ingress aware CSP headers itself, and a ResponseHeaderModifier
      "set" filter would replace them with the weaker approximation from
      wire-ingress.cspHeader. This mirrors the legacy nginx-ingress-services
      chart, which skips its CSP snippet for this host. */}}
      backendRefs:
        - name: webapp-http
          port: {{ $root.Values.service.webapp.externalPort }}
          kind: Service
{{- end }}
{{- end }}
{{- end }}
