{{- if (and .Values.gateway.create .Values.gateway.envoyProxy.create) }}
{{- $name := .Values.gateway.envoyProxy.name | default (include "wire-ingress.gatewayName" .) }}
{{- /*
  Envoy Gateway access logs include the request path by default, including the
  query string. We intentionally strip it here because browser-only flows may
  need to send access_token as a query parameter, and that must never end up in
  access logs.

  Envoy Gateway requires an explicit sink when accessLog settings are set, so we
  send the redacted format to /dev/stdout through a File sink.
*/ -}}
{{- $accessLogJSON := dict
  "start_time" "%START_TIME%"
  "method" "%REQ(:METHOD)%"
  "x-envoy-origin-path" "%PATH(NQ:ORIG_OR_PATH)%"
  "protocol" "%PROTOCOL%"
  "response_code" "%RESPONSE_CODE%"
  "response_flags" "%RESPONSE_FLAGS%"
  "response_code_details" "%RESPONSE_CODE_DETAILS%"
  "connection_termination_details" "%CONNECTION_TERMINATION_DETAILS%"
  "upstream_transport_failure_reason" "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
  "bytes_received" "%BYTES_RECEIVED%"
  "bytes_sent" "%BYTES_SENT%"
  "duration" "%DURATION%"
  "x-envoy-upstream-service-time" "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
  "x-forwarded-for" "%REQ(X-FORWARDED-FOR)%"
  "user-agent" "%REQ(USER-AGENT)%"
  "x-request-id" "%REQ(X-REQUEST-ID)%"
  ":authority" "%REQ(:AUTHORITY)%"
  "upstream_host" "%UPSTREAM_HOST%"
  "upstream_cluster" "%UPSTREAM_CLUSTER%"
  "upstream_local_address" "%UPSTREAM_LOCAL_ADDRESS%"
  "downstream_local_address" "%DOWNSTREAM_LOCAL_ADDRESS%"
  "downstream_remote_address" "%DOWNSTREAM_REMOTE_ADDRESS%"
  "requested_server_name" "%REQUESTED_SERVER_NAME%"
  "route_name" "%ROUTE_NAME%"
-}}
{{- $accessLogSink := dict "type" "File" "file" (dict "path" "/dev/stdout") -}}
{{- $accessLogSetting := dict "format" (dict "type" "JSON" "json" $accessLogJSON) "sinks" (list $accessLogSink) -}}
{{- $ep := .Values.gateway.envoyProxy -}}
{{- /*
  High availability defaults. A single proxy pod makes every node drain,
  cluster upgrade and autoscaler scale-down an ingress outage, and without a
  PodDisruptionBudget nothing stops an eviction taking the whole fleet at once.
  The spread constraints are advisory (ScheduleAnyway) so a single-node or
  single-zone cluster still schedules the pods, just co-located.
*/ -}}
{{- $deployment := dict "replicas" (int $ep.replicas) -}}
{{- with $ep.topologySpreadKeys -}}
{{- $selector := dict "matchLabels" (include "wire-ingress.proxyPodSelector" $ | fromYaml) -}}
{{- $spread := list -}}
{{- range . -}}
{{- $spread = append $spread (dict "maxSkew" 1 "topologyKey" . "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" $selector) -}}
{{- end -}}
{{- $_ := set $deployment "pod" (dict "topologySpreadConstraints" $spread) -}}
{{- end -}}
{{- $kubernetes := dict "envoyDeployment" $deployment -}}
{{- with $ep.podDisruptionBudget }}{{- $_ := set $kubernetes "envoyPDB" . }}{{- end -}}
{{- $spec := dict
    "telemetry" (dict "accessLog" (dict "settings" (list $accessLogSetting)))
    "provider" (dict "type" "Kubernetes" "kubernetes" $kubernetes) -}}
{{- /* Free-form spec wins over every default above. */ -}}
{{- with $ep.spec }}
{{- $spec = mergeOverwrite $spec (deepCopy .) }}
{{- end }}
{{- /* Shorthand for one leaf, so it must not replace the whole provider stanza. */ -}}
{{- if .Values.gateway.manageServiceType }}
{{- $k8s := $spec.provider.kubernetes }}
{{- $_ := set $k8s "envoyService" (merge (dict "type" .Values.gateway.serviceType) ($k8s.envoyService | default dict)) }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
{{- toYaml $spec | nindent 2 }}
{{- end }}
