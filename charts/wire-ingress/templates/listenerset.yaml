apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "wire-ingress.fullname" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "wire-ingress.gatewayName" . | quote }}
  listeners:
    {{- range $domain := include "wire-ingress.domains" . | fromJsonArray }}
    - name: {{ $domain.section }}
      port: {{ $.Values.gateway.listeners.https.port }}
      protocol: HTTPS
      hostname: {{ required "an HTTPS listener hostname is required (gateway.listeners.https.hostname for single-domain, or config.domains[].base/hostname)" $domain.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $domain.secretName | quote }}
            kind: Secret
    {{- end }}
    {{- if .Values.federator.enabled }}
    - name: {{ include "wire-ingress.federatorSectionName" . }}
      port: {{ .Values.gateway.listeners.https.port }}
      protocol: HTTPS
      hostname: {{ required "config.dns.federator is required when federator.enabled is true" .Values.config.dns.federator | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "federator.tls.secretName is required when federator.enabled is true" .Values.federator.tls.secretName | quote }}
            kind: Secret
    {{- end }}
    {{- range .Values.gateway.extraHttpsListeners }}
    - name: {{ required "extraHttpsListeners[].name is required" .name | quote }}
      port: {{ $.Values.gateway.listeners.https.port }}
      protocol: HTTPS
      hostname: {{ required "extraHttpsListeners[].hostname is required" .hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .certificateSecretName | default (include "wire-ingress.certificateSecretName" $) | quote }}
            kind: Secret
    {{- end }}
    {{- if .Values.gateway.listeners.http.enabled }}
    - name: http
      port: {{ .Values.gateway.listeners.http.port }}
      protocol: HTTP
      {{- with .Values.gateway.listeners.http.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
    {{- end }}
