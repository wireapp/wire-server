{{- if and .Values.federator.enabled .Values.gateway.patchPolicies.enabled }}
{{/* SRV targets carry a trailing dot in the federator's HTTP/2 :authority. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: {{ include "wire-ingress.fullname" . }}-federator-fqdn-domain
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    {{- if .Values.gateway.patchPolicies.targetGatewayClass }}
    kind: GatewayClass
    name: {{ .Values.gateway.className | quote }}
    {{- else }}
    kind: Gateway
    name: {{ include "wire-ingress.gatewayName" . | quote }}
    {{- end }}
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.route.v3.RouteConfiguration"
      {{- /* TLS route names are independent of XDSNameSchemeV2. */}}
      name: {{ printf "%s/%s/%s/%s/%s" .Release.Namespace (include "wire-ingress.gatewayName" .) .Release.Namespace (include "wire-ingress.fullname" .) (include "wire-ingress.federatorSectionName" .) | quote }}
      operation:
        op: add
        path: "/virtual_hosts/0/domains/-"
        value: {{ printf "%s." .Values.config.dns.federator | quote }}
{{- end }}
