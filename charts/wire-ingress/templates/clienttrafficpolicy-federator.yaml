{{- if .Values.federator.enabled }}
{{/* Section policies replace, rather than merge with, ListenerSet policies. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "wire-ingress.fullname" . }}-federator-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "wire-ingress.fullname" . | quote }}
      sectionName: {{ include "wire-ingress.federatorSectionName" . }}
  {{- if .Values.gateway.proxyProtocol.enabled }}
  proxyProtocol:
    optional: {{ .Values.gateway.proxyProtocol.optional }}
  {{- end }}
  tls:
    {{/* Optional at the ingress level so the federator service can throw the
         appropriate error when a cert is missing. Lua filter strips spoofed
         X-SSL-Certificate header if no cert was actually provided. */}}
    clientValidation:
      mode: VerifyIfGiven
      caCertificateRefs:
        - name: federator-ca
          kind: ConfigMap
    {{- include "wire-ingress.downstreamTls" . | trim | nindent 4 }}
{{- end }}
