{{- if .Values.federator.enabled }}
{{/* This section policy replaces the Gateway policy: repeat TLS/ALPN/PROXY settings. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "wire-ingress.gatewayName" . }}-federator-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "wire-ingress.gatewayName" . | quote }}
      sectionName: federator
  {{- if .Values.gateway.proxyProtocol.enabled }}
  proxyProtocol:
    optional: {{ .Values.gateway.proxyProtocol.optional }}
  {{- end }}
  tls:
    {{/* Optional at the ingress level so the federator service can throw the
         appropriate error when a cert is missing. Lua filter strips spoofed
         X-SSL-Certificate header if no cert was actually provided. */}}
    clientValidation:
      optional: true
      caCertificateRefs:
        - name: federator-ca
          kind: ConfigMap
    {{- include "wire-ingress.downstreamTls" . | trim | nindent 4 }}
{{- end }}
