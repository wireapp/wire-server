{{- if .Values.federator.enabled }}
{{/* Envoy Gateway-specific (gateway.envoyproxy.io/v1alpha1).
     Enforces mTLS client certificate validation on the federator listener only. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "wire-ingress.getGatewayName" . }}-federator-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "wire-ingress.getGatewayName" . | quote }}
      sectionName: federator
  tls:
    {{/* Optional at the ingress level so the federator service can throw the
         appropriate error when a cert is missing. Lua filter strips spoofed
         X-SSL-Certificate header if no cert was actually provided. */}}
    clientValidation:
      optional: true
      caCertificateRefs:
        - name: federator-ca
          kind: ConfigMap
{{- end }}
