{{- if .Values.fakeS3.enabled }}
{{- $root := . -}}
{{- $domains := include "wire-ingress.domains" . | fromJsonArray -}}
{{- range $domain := $domains }}
{{- if $domain.fakeS3 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wire-ingress.fullname" $root }}-minio{{ $domain.suffix }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    chart: "{{ $root.Chart.Name }}-{{ $root.Chart.Version }}"
    release: "{{ $root.Release.Name }}"
    heritage: "{{ $root.Release.Service }}"
spec:
  parentRefs:
    - name: {{ include "wire-ingress.gatewayName" $root | quote }}
      namespace: {{ $root.Release.Namespace | quote }}
      kind: Gateway
      sectionName: {{ $domain.section }}
  hostnames:
    - {{ required "config.dns.fakeS3 is required when fakeS3.enabled is true" $domain.fakeS3 | quote }}
  rules:
    {{- toYaml $root.Values.fakeS3.guardingRules | nindent 4 }}
    {{/* Default catch-all rule routes to the S3 backend */}}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $root.Values.service.s3.serviceName }}
          port: {{ $root.Values.service.s3.externalPort }}
          kind: Service
{{- end }}
{{- end }}
{{- end }}
