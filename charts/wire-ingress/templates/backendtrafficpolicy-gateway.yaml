{{- if .Values.gateway.zoneAwareRouting.enabled }}
{{/* The CRD requires an explicit load balancer type alongside zoneAware. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "wire-ingress.gatewayName" . }}-zone-aware
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "wire-ingress.gatewayName" . | quote }}
  loadBalancer:
    type: LeastRequest
    zoneAware:
      preferLocal:
        minEndpointsThreshold: {{ .Values.gateway.zoneAwareRouting.minEndpointsThreshold }}
{{- end }}
