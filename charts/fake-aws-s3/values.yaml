# See defaults in https://github.com/minio/minio/blob/RELEASE.2023-07-07T07-13-57Z/helm/minio/values.yaml
minio:
  fullnameOverride: fake-aws-s3
  service:
    port: "9000"
  mode: standalone
  image:
    repository: quay.io/wire/mirror-images/minio/minio
    tag: RELEASE.2023-07-07T07-13-57Z
  mcImage:
    repository: quay.io/wire/mirror-images/minio/mc
    tag: RELEASE.2023-06-28T21-54-17Z
  users:
    - accessKey: dummykey
      secretKey: dummysecret
      policy: consoleAdmin
  persistence:
    enabled: false
  environment:
    MINIO_BROWSER: "off"
  resources:
    requests:
      memory: 200Mi
  buckets:
    - name: dummy-bucket
      purge: false
      policy: none
    - name: assets
      purge: false
      policy: none
    - name: public
      purge: false
      policy: public
