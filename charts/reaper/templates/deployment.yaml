apiVersion: apps/v1
kind: Deployment
metadata:
  name: reaper
  labels:
    app: reaper
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reaper
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: reaper
        release: {{ .Release.Name }}
      annotations:
        # Ensure changes to the script cause a redeployment upon `helm upgrade`
        checksum/configmap: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "reaper.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: reaper
      containers:
        - name: reaper
          image: {{ include "reaper.image" . | quote }}
          imagePullPolicy: {{ default "" .Values.image.pullPolicy | quote }}
          command: ["/bin/sh", "/app/reaper.sh", "{{ .Release.Namespace }}", "{{ .Values.checkIntervalSeconds }}"]
        {{- if eq (include "includeSecurityContext" .) "true" }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
        {{- end }}
          env:
            # kubectl writes its discovery cache below $HOME; the root
            # filesystem is read-only, so point it at the emptyDir.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: reaper-script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: reaper-script
          configMap:
            name: reaper-script
            defaultMode: 0755
            items:
              - key: reaper.sh
                path: reaper.sh
        - name: tmp
          emptyDir: {}
