{{- if .Values.envoy.enabled }}
{{- $gatewayName := include "integration.getDynBackendsGatewayName" . }}
{{- $httpsPort := int .Values.envoy.gateway.listeners.https.port }}
{{- $controllerNs := .Values.envoy.controllerNamespace }}
{{- if lt $httpsPort 1024 }}
{{- fail (printf "envoy.gateway.listeners.https.port is %d (privileged, <1024). Envoy Gateway remaps it to %d on the proxy pod. Set envoy.gateway.listeners.https.port to the actual container port (e.g. %d)." $httpsPort (add $httpsPort 10000) (add $httpsPort 10000)) }}
{{- end }}
---
# EnvoyProxy configures the proxy deployment/service for the dynamic-backends Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gatewayName }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # ClusterIP: no external load balancer needed for in-cluster integration tests.
        type: ClusterIP
---
# Gateway for all dynamic backends. A single HTTPS listener covers all backend hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
spec:
  gatewayClassName: {{ required "envoy.gateway.className is required when envoy.enabled is true" .Values.envoy.gateway.className | quote }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gatewayName | quote }}
  listeners:
    - name: https
      port: {{ $httpsPort }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.envoy.federator.tls.secretName | quote }}
            kind: Secret
---
# ClientTrafficPolicy enforces optional mTLS client cert validation on all dynamic-backend
# connections (mirrors the nginx auth-tls-verify-client: "on" annotation).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $gatewayName }}-mtls
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName | quote }}
      sectionName: https
  tls:
    clientValidation:
      optional: true
      caCertificateRefs:
        - name: federator-ca
          kind: ConfigMap
---
# EnvoyPatchPolicy strips the trailing dot from the request :authority before route matching.
# Wire federator resolves federation targets via DNS SRV records; per RFC 2782 those targets
# are FQDNs with a trailing dot (e.g. "backend-fed.ns.svc.cluster.local."). HTTP/2 carries that
# dot into :authority. Gateway API HTTPRoute hostnames cannot contain a trailing dot, so without
# normalisation Envoy returns route_not_found for the dotted authority.
#
# Enabling strip_trailing_host_dot on the HttpConnectionManager makes the dotted authority match
# the normal (dot-less) HTTPRoute hostname. This is a single, gateway-scoped patch shared by all
# dynamic backends: unlike a per-backend "/virtual_hosts/<index>/domains/-" patch it does NOT
# depend on the order (or existence) of virtual hosts in the generated RouteConfiguration, so it
# is not subject to the virtual-host ordering race.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: {{ $gatewayName }}-strip-trailing-host-dot
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gatewayName | quote }}
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      # The xDS listener name is <namespace>/<gateway>/<listener>.
      name: {{ printf "%s/%s/https" $.Release.Namespace $gatewayName | quote }}
      operation:
        op: add
        # The HTTPS (TLS-terminate) listener has a single filter chain whose first network filter
        # is the HttpConnectionManager shared by every dynamic-backend virtual host. If a cluster
        # run shows this path missing (e.g. the HCM sits under /default_filter_chain instead of
        # /filter_chains/0), adjust this path accordingly; verify with
        #   kubectl get envoypatchpolicy {{ $gatewayName }}-strip-trailing-host-dot -o yaml
        # (status.conditions Programmed=True) and `egctl config envoy-proxy listener`.
        path: "/filter_chains/0/filters/0/typed_config/strip_trailing_host_dot"
        value: true
---
{{- $backendNames := keys .Values.config.dynamicBackends | sortAlpha }}
{{- range $name := $backendNames }}
{{- $dynamicBackend := index $.Values.config.dynamicBackends $name }}
{{- $httpRouteName := printf "%s-dynbackend-%s" $gatewayName $name }}
{{- $svcDomain := printf "%s-%s.%s.svc.cluster.local" $dynamicBackend.federatorExternalHostPrefix $.Release.Namespace $controllerNs }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $httpRouteName }}
spec:
  parentRefs:
    - name: {{ $gatewayName | quote }}
      namespace: {{ $.Release.Namespace | quote }}
      kind: Gateway
      sectionName: https
  hostnames:
    - {{ $svcDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: integration
          port: {{ $dynamicBackend.federatorExternalPort }}
          kind: Service
---
# EnvoyExtensionPolicy injects the mTLS client certificate as X-SSL-Certificate request
# header, matching the nginx $ssl_client_escaped_cert behaviour expected by federator.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ $httpRouteName }}-cert-header
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $httpRouteName }}
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          {{/* Strip any client-provided header to prevent spoofing */}}
          request_handle:headers():remove("X-SSL-Certificate")
          local ssl = request_handle:connection():ssl()
          if ssl ~= nil then
            local cert = ssl:urlEncodedPemEncodedPeerCertificate()
            if cert ~= nil and cert ~= "" then
              request_handle:headers():add("X-SSL-Certificate", cert)
            end
          end
        end
---
# ClusterIP service in {{ $controllerNs }} selects the Envoy proxy pods for this Gateway.
# The service name determines the SRV record used by federation discovery:
#   _wire-server-federator._tcp.{{ $svcDomain }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $dynamicBackend.federatorExternalHostPrefix }}-{{ $.Release.Namespace }}
  namespace: {{ $controllerNs }}
spec:
  type: ClusterIP
  ports:
  - name: wire-server-federator
    port: 443
    protocol: TCP
    targetPort: {{ $httpsPort }}
  selector:
    gateway.envoyproxy.io/owning-gateway-name: {{ $gatewayName }}
    gateway.envoyproxy.io/owning-gateway-namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
