# NOTE: zone-aware Service routing is configured once for the whole release via
# `global.trafficDistribution` in the wire-server chart's values.yaml.
replicaCount: 3
# Spread pods over availability zones as well as nodes.
#
# The zone constraint keeps an endpoint of this component in every zone, which
# both survives the loss of a zone and lets Kubernetes' zone-aware routing
# (`service.kubernetes.io/topology-mode: Auto` on the Service, or
# `global.trafficDistribution`) actually keep traffic in-zone. With
# `topology-mode: Auto` the EndpointSlice controller publishes no hints at all
# -- silently routing across every zone -- unless endpoints are distributed in
# proportion to each zone's allocatable CPU, so a lopsided rollout quietly
# turns into cross-AZ traffic, which cloud providers bill in both directions.
#
# Both constraints are soft (ScheduleAnyway) so that single-zone clusters, and
# clusters whose nodes carry no `topology.kubernetes.io/zone` label at all,
# keep scheduling normally. Set to [] to opt out entirely.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: federator
  - maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: federator

image:
  repository: quay.io/wire/federator
  tag: do-not-use

service:
  internalFederatorPort: 8080
  externalFederatorPort: 8081

metrics:
  serviceMonitor:
    enabled: false

tls:
  # if enabled, federator will get its client certificate and private key from
  # the secret used by the federator ingress
  useSharedFederatorSecret: false

resources:
  # FUTUREWORK: come up with numbers which didn't appear out of thin air (See
  # https://wearezeta.atlassian.net/browse/BE-518)
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
config:
  logLevel: Info
  logFormat: StructuredJSON
  logNetStrings: false
  optSettings:
    # Defaults to using system CA store in the federator image for making
    # connections to remote federators.
    # A custom CA certificate can be provided by specifying
    #   federator.remoteCAContents
    # e.g. from a pem file myca.pem:
    #   { echo "federator:"; echo "  remoteCAContents: |"; sed -e 's/^/    /' myca.pem; } > myca.yaml
    # then use '-f myca.yaml' as additional flag to your helm commands.
    #
    # Using custom CA doesn't automatically disable system CA store, it should
    # be disabled explicitly by setting useSystemCAStore to false.
    #
    # A client certificate and corresponding private key can be specified
    # similarly to a custom CA store.
    useSystemCAStore: true
    # In microseconds, default is 5s.
    tcpConnectionTimeout: 5000000

podSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

tests:
  # The host used for the nginxIngress endpoint and originDomain in the integration
  # test config. Depends on the release name of the "wire-ingress" helm chart
  # (see federation-test-helper.yaml in that chart).
  nginxIngressHost: "set-me"
  config: {}
