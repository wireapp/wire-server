apiVersion: v1
kind: Service
metadata:
  name: nginz
  labels:
    app: nginz
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    {{- if ge (.Capabilities.KubeVersion.Minor|int) 26 }}
    service.kubernetes.io/topology-mode: Auto
    {{- else }}
    service.kubernetes.io/topology-aware-hints: auto
    {{- end }}
spec:
  {{- with (default dict .Values.global).trafficDistribution }}
  {{- if not (semverCompare ">= 1.31-0" (include "kubeVersion" $)) }}
  {{- fail "global.trafficDistribution requires Kubernetes >= 1.31 (beta) or >= 1.33 (GA); unset it or upgrade the cluster" }}
  {{- end }}
  trafficDistribution: {{ . }}
  {{- end }}
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.config.http.httpPort }}
      targetPort: 8080
    - name: ws
      port: {{ .Values.config.ws.wsPort }}
      targetPort: 8081
    - name: http-metrics
      port: {{ .Values.config.http.metricsPort }}
      targetPort: 8082
  selector:
    app: nginz
