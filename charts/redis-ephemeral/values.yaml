redis-ephemeral:
  # We use a single node redis for now.
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 6.2.7-debian-11-r0
  master:
    persistence:
      enabled: false
    resources:
      limits:
        cpu: "1000m"
        memory: "1024Mi"
      requests:
        cpu: "500m"
        memory: "512Mi"
