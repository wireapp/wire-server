# Optional overlay, applied AFTER manifests.yaml.
# A public DNS name derived from the PoC LB's assigned IP avoids the broken
# shared external-dns controller. HTTP-01 uses only namespaced resources.
# If the LB is recreated with another IP, update this name everywhere below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tr-http01
  namespace: joe-test
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: tr-http01-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: tr
                namespace: joe-test
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tr-public-certificate
  namespace: joe-test
spec:
  secretName: tr-public-certificate
  dnsNames: [tr.46.225.37.184.sslip.io]
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    name: tr-http01
    kind: Issuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tr
  namespace: joe-test
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: tr
  listeners:
    - name: https
      hostname: tr.46.225.37.184.sslip.io
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: tr-public-certificate
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      hostname: tr.46.225.37.184.sslip.io
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tr-hello
  namespace: joe-test
spec:
  parentRefs:
    - name: tr
      sectionName: https
  hostnames: [tr.46.225.37.184.sslip.io]
  rules:
    - backendRefs:
        - name: tr-hello
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tr-redirect
  namespace: joe-test
spec:
  parentRefs:
    - name: tr
      sectionName: http
  hostnames: [tr.46.225.37.184.sslip.io]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
